# Codex-generated fixes for failed repository checks.
---
name: Codex auto-fix

on:  # yamllint disable-line rule:truthy
  # zizmor: ignore[dangerous-triggers] gated below to same-repo head refs, so no fork-controlled code is checked out
  workflow_run:
    workflows:
      - Android CI
      - Backend CI
      - Dependency Submission
      - MegaLinter
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: codex-auto-fix-${{ github.event.workflow_run.run_id || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  fix_and_pr:
    # The workflow_run branch checks out the failing head SHA and then runs
    # repository tooling plus a Codex action holding OPENAI_API_KEY, with
    # contents:write. Restrict this to runs from this repository.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'failure' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Backend CI'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Backend CI'
        run: npm ci
        working-directory: backend

      - name: Set up JDK 17
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.name == 'Android CI' ||
          github.event.workflow_run.name == 'Dependency Submission'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.name == 'Android CI' ||
          github.event.workflow_run.name == 'Dependency Submission'
        uses: gradle/actions/setup-gradle@v6

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            The repository workflow "${{ github.event.workflow_run.name || 'manual Codex auto-fix run' }}"
            failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}.

            Reproduce only the relevant check:
            - Android CI: run
              `./gradlew --no-daemon --stacktrace lintDebug assembleDebug testDebugUnitTest`.
            - Backend CI: from `backend`, run `npx wrangler types`, `npm run typecheck`,
              and `npm test`.
            - Dependency Submission: inspect whether dependency graph generation or dependency
              review failed, then reproduce the smallest relevant Gradle dependency resolution.
            - MegaLinter: inspect the failed linter and run only its targeted check where possible.

            Identify the minimal change needed to make the failing check pass, implement only that
            change, and rerun the smallest relevant command. Do not refactor unrelated files.

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes and open PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event.workflow_run.run_id || github.run_id }}
        run: |
          branch="codex/auto-fix-$RUN_ID"

          git switch -c "$branch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-fix failing checks via Codex"
          gh auth setup-git
          git push origin "$branch"

          {
            echo "Codex generated this patch after repository checks failed for \`$FAILED_HEAD_SHA\`."
            echo
            echo "Review the changes before merging."
          } > pr-body.md

          gh pr create \
            --base "$FAILED_HEAD_BRANCH" \
            --head "$branch" \
            --title "Auto-fix failing checks via Codex" \
            --body-file pr-body.md
