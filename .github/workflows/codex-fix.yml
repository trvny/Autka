# Manually requested Codex fixes for repository checks.
---
name: Codex fix

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      target:
        description: Check to reproduce
        required: true
        type: choice
        options:
          - android
          - backend
          - dependency
          - lint
      context:
        description: Optional failure details or run URL
        required: false
        type: string

concurrency:
  group: codex-fix-${{ github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  fix_and_pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: inputs.target == 'backend'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: inputs.target == 'backend'
        run: npm ci
        working-directory: backend

      - name: Set up JDK 17
        if: inputs.target == 'android' || inputs.target == 'dependency'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: inputs.target == 'android' || inputs.target == 'dependency'
        uses: gradle/actions/setup-gradle@v6

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Fix the selected repository check on the current default branch.
            Target: ${{ inputs.target }}
            Additional context: ${{ inputs.context || 'none' }}

            Reproduce only the selected check:
            - android: run
              `./gradlew --no-daemon --stacktrace lintDebug assembleDebug testDebugUnitTest`.
            - backend: from `backend`, run `npx wrangler types`, `npm run typecheck`,
              and `npm test`.
            - dependency: inspect dependency graph or review failures, then reproduce
              the smallest relevant Gradle dependency resolution.
            - lint: inspect the supplied failure details and run only the targeted linter.

            Identify and implement the smallest relevant fix, then rerun the smallest
            useful verification. Do not refactor unrelated files.

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes and open PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          branch="codex/fix-$TARGET-$RUN_ID"
          git switch -c "$branch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix $TARGET checks via Codex"
          gh auth setup-git
          git push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Fix $TARGET checks via Codex" \
            --body "Codex generated this patch from a manually requested run. Review before merging."
