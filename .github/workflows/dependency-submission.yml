name: Dependency Submission

on:
  push:
    branches: [ main ]
    # The Gradle graph only changes when these change; don't re-resolve it on
    # every push. PR dependency-review (below) stays broad and runs on all PRs.
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]

jobs:
  # On push to main: resolve the full Gradle dependency graph (including transitive
  # deps) and submit it to GitHub. This is what lets Dependabot security alerts work
  # for Gradle, which it otherwise can't fully do from the version catalog alone.
  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write        # required to submit the dependency graph
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
        with:
          # Report only what reaches a user. Measured 22.08.2026 with `gradle :app:dependencies`:
          # every netty coordinate here sits in AGP's Unified Test Platform configurations, and
          # the rest of the flagged set comes from androidLintTool, unit-test classpaths and the
          # buildscript. None of it is in releaseRuntimeClasspath, and AGP still pins netty
          # 4.1.110, so there is no upstream fix to take. `kanarek` carries the identical set
          # from the identical cause.
          #
          # The cost is deliberate: a CVE in a build tool -- the Kotlin Gradle plugin, lint --
          # will no longer raise an alert. That build-integrity risk is traded against 97 alerts
          # across two repositories that bury anything genuine. Delete this to get it back.
          #
          # `[Rr]` is not decoration: with no product flavours AGP names this project's
          # shipping configuration `releaseRuntimeClasspath`, lowercase, which
          # `.*ReleaseRuntimeClasspath` matches zero times -- an empty graph suppressing
          # everything, the opposite of the intent. Verified against all 142 configuration
          # names in this build. The upstream docs use the same `[Tt]` idiom.
          dependency-graph-include-configurations: ^[a-z]*[Rr]eleaseRuntimeClasspath$

  # On pull requests: compare the PR's dependencies against the base and fail if a PR
  # introduces a known-vulnerable dependency, before it's merged.
  dependency-review:
    name: Review PR dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
