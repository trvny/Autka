name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Only cancel in-progress PR runs. A push to main or the weekly schedule
  # must not be cancelled by a later event sharing the same ref, or the
  # default branch's alert state goes stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The java-kotlin database can only be built by actually compiling
      # app/, since CodeQL's autobuilder can't do this for an Android app
      # on its own. This mirrors android-ci.yml's build steps, including
      # caching, so the extra language doesn't add real CI cost.
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.3.0

      # CodeQL's tracer only sees code that is actually compiled while it's
      # attached, so the build and configuration caches are disabled here -
      # a cache hit would let compileKotlin/compileJava skip javac/kotlinc
      # entirely and the java-kotlin database would come back empty, passing
      # green while silently analysing nothing.
      - name: Build app (debug)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
