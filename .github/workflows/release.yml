# Autka release workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release names
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Release tag must start with v and contain only filename-safe characters."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify declared version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          declared="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$declared" ] || [ "$declared" != "$RELEASE_VERSION" ]; then
            echo "::error::Tag version $RELEASE_VERSION does not match app versionName ${declared:-missing}."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Validate signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false

          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        env:
          AUTKA_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AUTKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AUTKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AUTKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify and name release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='$RELEASE_VERSION'"
          unzip -Z1 "$aab" | grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$'
          jarsigner -verify "$aab" >/dev/null

          cp "$apk" "dist/autka-$RELEASE_VERSION.apk"
          cp "$aab" "dist/autka-$RELEASE_VERSION.aab"
          ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Autka ${{ steps.release.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
